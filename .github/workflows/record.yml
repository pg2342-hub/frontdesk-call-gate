name: Record a live run

# Calls Claude for every case (agent and judge), saves the replies to recordings/,
# rebuilds the demo page from them, and commits both. Needs the ANTHROPIC_API_KEY secret.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOLIVE_LIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Live run (3 runs of 30 calls, Claude agent + Claude judge)
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "Set the ANTHROPIC_API_KEY repo secret first"; exit 1; }
          rm -f recordings/agent.jsonl recordings/judge.jsonl
          set +e
          golive run evals/golive.live.yml --out reports/live
          code=$?
          set -e
          cat reports/live/report.md >> "$GITHUB_STEP_SUMMARY"
          # 0 go, 1 no-go, 2 partial are all results worth keeping; 3 is a config error
          test "$code" -ne 3
          # keep only a complete recording: 90 agent calls (30 cases x 3 runs), none crashed
          test "$(wc -l < recordings/agent.jsonl)" -eq 90 || { echo "incomplete recording, not committing"; exit 1; }
      - name: Rebuild the demo page from the recording
        run: bash scripts/build_demo.sh
      - name: Commit the recording
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recordings docs
          git commit -m "Record live run" || echo "nothing to commit"
          git push
          # pushes made with GITHUB_TOKEN do not start CI; the next push by a person does
