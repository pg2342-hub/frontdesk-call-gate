[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frontdesk-call-gate"
version = "0.1.0"
description = "Go-live gate for an AI hotel front desk agent"
requires-python = ">=3.10"
dependencies = [
  "golive-gate[claude]==0.1.1",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["frontdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["frontdesk"]
known-third-party = ["golive_gate"]
